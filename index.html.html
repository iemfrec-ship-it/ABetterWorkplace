<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Better Workplace — English Escape Game</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2622;--y:#ffe66d;--p:#ffa8d0;--g:#a6e49c;--b:#9ad8ff;--o:#ffbb7a}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;background:#c9a26b radial-gradient(#b68850 1.6px,transparent 1.6px) 0 0/15px 15px}
h1,h2,h3,.hand{font-family:'Caveat',cursive;margin:0}
h1{font-size:3rem;line-height:1}h2{font-size:2.1rem}h3{font-size:1.5rem}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 70px}
.note{background:var(--y);padding:24px 20px 20px;box-shadow:3px 6px 14px rgba(0,0,0,.28);margin:0 0 20px;position:relative}
.note::before{content:'📌';position:absolute;top:-14px;left:calc(50% - 10px);font-size:1.4rem}
.n1{transform:rotate(-1.2deg)}.n2{transform:rotate(1deg)}.pk{background:var(--p)}.gr{background:var(--g)}.bl{background:var(--b)}.or{background:var(--o)}
.btn{font:800 1rem 'Nunito',sans-serif;border:2px solid var(--ink);background:#fff;color:var(--ink);padding:10px 20px;border-radius:6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid #1b5fd6;outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sm{padding:5px 12px;font-size:.85rem}
input{font:700 1.1rem 'Nunito',sans-serif;padding:10px;border:2px solid var(--ink);border-radius:6px;background:#fffdf0;width:100%}
.err{color:#b3261e;font-weight:800;min-height:1.3em;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;margin:24px 0}
.grid .note{margin:0;min-height:150px;cursor:pointer}
.grid .note:nth-child(odd){transform:rotate(-1.5deg)}.grid .note:nth-child(even){transform:rotate(1.2deg)}
.lock{opacity:.55;cursor:default!important}
.q{background:#fffdf0;border:2px solid var(--ink);border-radius:6px;padding:14px;margin-bottom:12px;box-shadow:2px 3px 0 rgba(0,0,0,.2)}
.opt{padding:10px 12px;border:2px solid #cfc7b0;border-radius:6px;margin-top:8px;cursor:pointer;font-weight:700;background:#fff}
.opt:hover{border-color:var(--ink)}.sel{border-color:#1b5fd6;background:#e6efff}
.ok{border-color:#2e7d32!important;background:#e3f6e4!important}.ko{border-color:#c62828!important;background:#fde5e5!important}
.badge{position:fixed;top:10px;right:10px;z-index:9;background:var(--y);border:2px solid var(--ink);padding:5px 14px;font:700 1.35rem 'Caveat',cursive;box-shadow:2px 3px 0 var(--ink);transform:rotate(2deg)}
.chip{display:inline-block;background:var(--y);border:2px solid var(--ink);padding:2px 14px;margin:3px;font:700 1.5rem 'Caveat',cursive}
.big{font:700 3.6rem 'Caveat',cursive;text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ban{background:#fff3cd;border:2px dashed var(--ink);padding:10px;margin-bottom:14px;font-weight:800}
footer{text-align:center;font-weight:700;margin-top:30px}footer a{cursor:pointer;text-decoration:underline}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.used{opacity:.4;pointer-events:none}.on{background:#cfe3ff}
.ti{width:auto;min-width:90px;max-width:150px;padding:4px 8px;font-size:1rem;display:inline-block;margin:0 4px}
.vf{display:flex;gap:16px;align-items:flex-start}.tx{flex:1;position:sticky;top:10px;background:#fffdf0;border:2px solid var(--ink);padding:14px;line-height:1.55;max-height:92vh;overflow:auto}.qs{flex:1}
.fab,.fab3{display:none}.fab2{position:fixed;bottom:12px;right:12px;z-index:30}
@media(max-width:760px){.vf{display:block}.tx{display:none}.tx.open{display:block;position:fixed;inset:10px;z-index:40}.fab,.tx.open .fab3{display:block}.fab{position:fixed;bottom:12px;left:12px;z-index:30}.two{grid-template-columns:1fr}}
@media print{.noprint,.badge,.fab,.fab2{display:none!important}body{background:#fff}.note{transform:none;box-shadow:none}}
@media(prefers-reduced-motion:no-preference){.note{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const WW=['THIS','IS','A','BETTER','WORKPLACE'];
const P=[['overtime','heures supplémentaires'],['fast','rapide'],['teamwork',"travail d'équipe"],['busy','très occupé, très chargé'],['manager','responsable'],['salary','salaire'],['stressful','stressant'],['physical','physique'],['deadlines','délais, échéances'],['targets','objectifs (chiffrés)'],['pressure','pression'],['customers','clients'],['tired','fatigué'],['warehouse','entrepôt'],['jobs','emplois, postes'],['long hours','longues heures de travail'],['smiling','souriant'],['friendly','sympathique, accueillant'],['noisy','bruyant'],['training','formation'],['breaks','pauses'],['multitasking','faire plusieurs tâches à la fois'],['communication','communication'],['rush','coup de feu, précipitation'],['helpful','serviable'],['organisation','organisation'],['varied','varié'],['problem solving','résolution de problèmes'],['shift','poste, tranche horaire de travail'],['colleague','collègue']];
const MS=[['📋','Mission 1','Vocabulaire du travail'],['🔁','Mission 2','Matching français → anglais'],['📖','Mission 3','Vrai / Faux'],['🔗','Mission 4','Mot / définition'],['✏️','Mission 5','Présent simple']];
const MT=['QCM de vocabulaire : mot anglais → traduction française (30 mots, 10 par tentative)','Matching français → anglais (10 mots par tentative)','Vrai / Faux en français sur un texte (12 affirmations, 3 textes)','Association mot anglais / définition en anglais','Conjugaison au présent simple : affirmatif, négatif, interrogatif (12 phrases mélangées)'];
const D=['extra hours that you work after your normal working day','done or moving at high speed','when a group of people work together to do a job','having a lot of things to do','the person who is in charge of a team or a business','the money that you receive every month for your job','making you feel worried and tense','connected with your body, not your mind','the dates or times by which work must be finished','goals or numbers that you must reach at work','the feeling that you must do many things quickly and well','people who buy things or services from a shop or company','needing to rest or sleep','a large building where goods are stored','the work that people do to earn money','a lot of time spent at work every day','showing happiness with your mouth and face','kind and pleasant to other people','making a lot of loud sounds','learning the skills that you need for a job','short times when you stop working to rest','doing several tasks at the same time','sharing information with other people','a short period when everybody is in a hurry','ready to help other people','planning things in a clear and logical way','with many different things, not always the same','finding solutions to difficulties','a fixed period of time when a person works','a person who works with you'];
const TX=[['A Day at Burger Corner',`My name is Tom and I am 19. I work in a fast-food restaurant in the city centre. I love meeting people, but my job is not easy.
The busiest time is lunch. Suddenly, the restaurant is full and the kitchen is very noisy. Customers are hungry and they want their food fast, so the pressure is high. Some customers are polite and smiling, but others are angry when they wait. I try to stay calm and I always say sorry if there is a problem.
I work with three colleagues and we are a real team. When one person is tired, the others help. Last week, a colleague was ill, so I did overtime and I stayed longer. I was happy to help, but I was very tired at the end of the day.
My manager is friendly. During my training she explained everything slowly and she answered all my questions. She also gives us breaks, because she knows that we need to rest. I eat something and I talk with my colleagues. It helps me to forget the stress.
I like the atmosphere and the teamwork. However, I don't like working at weekends because the days are very long and I never see my friends. In the future, I want to become a manager.`,[[`Tom aime rencontrer des gens, mais son travail n'est pas facile.`,1],[`Le moment le plus calme de la journée est l'heure du déjeuner.`,0],[`Les clients veulent être servis vite, ce qui met Tom sous pression.`,1],[`Tous les clients sont toujours aimables avec Tom.`,0],[`Quand il y a un problème, Tom s'énerve et ne s'excuse pas.`,0],[`Tom travaille avec une équipe qui s'entraide.`,1],[`Tom a refusé d'aider un collègue malade.`,0],[`Après des heures supplémentaires, Tom était content d'avoir aidé mais très fatigué.`,1],[`Pendant sa formation, la manager a répondu à toutes les questions de Tom.`,1],[`Pendant les pauses, Tom discute avec ses collègues, ce qui l'aide à relâcher le stress.`,1],[`Tom aime travailler le week-end parce qu'il voit ses amis.`,0],[`Tom ne souhaite pas évoluer professionnellement.`,0]]],
['Maya, warehouse worker',`My name is Maya and I am 22. I work in a big warehouse near the motorway. I prepare orders for customers, and I walk a lot every day.
My job is very physical. I carry boxes and I stand up for hours. At the end of the day, my back and my feet hurt. Every worker has a target, so we must prepare a lot of orders. When the deadlines are close, everybody works faster and the stress is high. Sometimes I feel tired and a little nervous.
The warehouse is noisy and I wear safety shoes and gloves. During my training, my manager explained the safety rules and showed me how to carry heavy boxes correctly. I think this is very important.
My colleagues are great. We work as a team: if somebody has a problem, we help immediately. At break time, we sit together, we have a coffee and we laugh. It gives me energy for the rest of the day.
I don't earn a very high salary, but I like the job because every day is different and I am proud of my work. I want to learn more and to become a team leader.`,[[`Maya prépare des commandes pour des clients dans un grand entrepôt.`,1],[`Son travail est surtout un travail de bureau, assise toute la journée.`,0],[`À la fin de la journée, Maya a mal au dos et aux pieds.`,1],[`Quand les délais approchent, tout le monde ralentit pour éviter le stress.`,0],[`L'entrepôt est calme et Maya n'a pas besoin d'équipement de protection.`,0],[`Pendant sa formation, son responsable lui a expliqué les règles de sécurité.`,1],[`Maya pense que la sécurité n'est pas importante.`,0],[`Quand quelqu'un a un problème, les collègues l'aident tout de suite.`,1],[`Pendant les pauses, Maya reste seule dans son coin.`,0],[`Les pauses lui donnent de l'énergie pour la suite de la journée.`,1],[`Maya aime son travail parce que chaque journée est différente et qu'elle est fière de ce qu'elle fait.`,1],[`Maya trouve que son salaire est très élevé.`,0]]],
['Sara, shop assistant',`My name is Sara and I work in a furniture shop. Six months ago, I was very unhappy at work. My schedule changed every week, so I never knew when I finished. I was always tired and I had no time for my family.
I also had a lot of pressure. My manager wanted high sales targets and the customers were often impatient. I was worried all the time and I couldn't sleep well. One day I was so stressed that I wanted to cry in the storeroom.
A colleague, Nadia, saw me and she listened to me. She said, "You must talk to our manager." I was afraid, but the next day I explained my problems. To my surprise, my manager was kind. She said sorry and she asked, "How can I help?"
Now we have a fixed schedule and everybody has a real break at lunch. We also have a short team meeting every Monday to share ideas and problems. The shop is still busy, but the atmosphere is much better. I feel more relaxed and I smile at customers again.
My advice is simple: don't stay silent. Communication can make a workplace better.`,[[`Au début, Sara était malheureuse à cause de ses horaires qui changeaient chaque semaine.`,1],[`Sara avait beaucoup de temps libre pour sa famille.`,0],[`Les objectifs de vente élevés et les clients impatients lui mettaient la pression.`,1],[`Sara dormait très bien malgré le stress.`,0],[`Une collègue a vu Sara en difficulté et l'a écoutée.`,1],[`Sara n'a jamais osé parler à sa responsable.`,0],[`La responsable a réagi avec gentillesse et a proposé son aide.`,1],[`Aujourd'hui, Sara a encore des horaires qui changent chaque semaine.`,0],[`Une réunion d'équipe chaque semaine permet de partager idées et problèmes.`,1],[`Le magasin n'est plus du tout occupé.`,0],[`Sara se sent plus détendue et sourit de nouveau aux clients.`,1],[`Sara conseille de garder ses problèmes pour soi.`,0]]]];
const SN=[[`Sara ____ (finish) work at six.=finishes`,`We ____ (help) each other every day.=help`,`Maya ____ (wear) safety shoes.=wears`,`My manager ____ (have) a lot of meetings.=has`,`Tom ____ (work) on Sundays. (–)=doesn't work/does not work`,`I ____ (like) long hours. (–)=don't like/do not like`,`The shop ____ (open) at 7 a.m. (–)=doesn't open/does not open`,`They ____ (take) a break at noon. (–)=don't take/do not take`,`____ your manager ____ (help) you? (?)=Does|help`,`____ you ____ (work) on Saturdays? (?)=Do|work`,`____ the warehouse ____ (close) at night? (?)=Does|close`,`____ your colleagues ____ (start) early? (?)=Do|start`],
[`Tom ____ (carry) heavy boxes.=carries`,`They ____ (answer) customers' questions.=answer`,`The kitchen ____ (get) very noisy at lunch.=gets`,`I ____ (eat) with my colleagues.=eat`,`Sara ____ (finish) early on Fridays. (–)=doesn't finish/does not finish`,`We ____ (need) more overtime. (–)=don't need/do not need`,`My manager ____ (shout) at us. (–)=doesn't shout/does not shout`,`You ____ (rest) enough. (–)=don't rest/do not rest`,`____ Tom ____ (start) at nine? (?)=Does|start`,`____ they ____ (have) a break? (?)=Do|have`,`____ she ____ (feel) tired after work? (?)=Does|feel`,`____ the customers ____ (wait) a long time? (?)=Do|wait`],
[`Nadia ____ (go) to the team meeting every Monday.=goes`,`Sara ____ (try) to stay calm.=tries`,`We ____ (share) ideas in meetings.=share`,`The new employee ____ (watch) the training video.=watches`,`He ____ (earn) a high salary. (–)=doesn't earn/does not earn`,`I ____ (sleep) well when I am stressed. (–)=don't sleep/do not sleep`,`Sara ____ (feel) stressed now. (–)=doesn't feel/does not feel`,`Our team ____ (make) many mistakes. (–)=doesn't make/does not make`,`____ you ____ (work) in a team? (?)=Do|work`,`____ your boss ____ (give) you breaks? (?)=Does|give`,`____ the training ____ (help) new employees? (?)=Does|help`,`____ they ____ (finish) late on Saturdays? (?)=Do|finish`]].map(a=>a.map(x=>x.split('=')));
let S=null,E={},tmp={f:'',l:''},scr='home',msg='';
const $=document.getElementById('app');
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b};
const btn=(t,f,c='',x='')=>`<button class="btn ${c}" onclick="${f}" ${x}>${t}</button>`;
/* ── stockage local ── */
const K='abw_';
function save(){try{localStorage.setItem(K+S.id,JSON.stringify(S))}catch(e){}}
function load(id){try{return JSON.parse(localStorage.getItem(K+id))}catch(e){return null}}
function savedIds(){const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(K))r.push(k.slice(K.length))}}catch(e){}return r.sort()}
function split(){let s,ok;const G=[[1,23],[16,17,24],[8,9],[0,15],[14,28],[3,12]];do{s=shuf([...Array(30).keys()]);ok=G.every(g=>[0,10,20].every(a=>g.filter(i=>s.slice(a,a+10).includes(i)).length<2))}while(!ok);return[s.slice(0,10),s.slice(10,20),s.slice(20)]}
function fresh(id){return{id,pts:0,sets:{1:split(),2:split(),4:split()},att:{1:1,2:1,3:1,4:1,5:1},dn:{},words:shuf(WW),rv:[],res:[],wr:[],t0:Date.now()}}
function begin(id){S=fresh(id);save();go('board')}
function resume(id){const s=load(id);if(!s){msg='Sauvegarde introuvable.';return go('id')}S=s;go('board')}
function restart(id){if(confirm('Effacer la progression de '+id+' et recommencer à zéro ?'))begin(id)}
function del(id){if(confirm('Supprimer la sauvegarde de '+id+' ?')){try{localStorage.removeItem(K+id)}catch(e){}render()}}
/* ── navigation ── */
function go(s){scr=s;render();scrollTo(0,0)}
function render(){const game=['board','ex','reveal','fin','vic','rep'].includes(scr);$.innerHTML=view()+(game&&S?`<div class="badge">⭐ ${S.pts} pts</div>`+(scr!=='rep'?`<button class="btn sm fab2" onclick="S._b=scr;go('rep')">📥 Rapport</button>`:''):'')}
function login(kind){const v=(document.getElementById('c').value||'').trim().toUpperCase();if(v===(kind==='t'?'0504':'WORKPLACE')){msg='';go(kind==='t'?'tdb':'id')}else{document.getElementById('e').textContent='Code incorrect. Réessayez.'}}
function setN(k,el){tmp[k]=el.value=el.value.replace(/[^a-zA-Z]/g,'').toUpperCase().slice(0,2)}
function goId(){if(tmp.f.length<2||tmp.l.length<2){document.getElementById('e').textContent='Saisissez 2 lettres pour le prénom et 2 pour le nom.';return}const id=tmp.f+'-'+tmp.l;if(load(id)){tmp.ex=id;go('choice')}else begin(id)}
/* ── vues ── */
function view(){
 if(scr==='home')return `<div class="wrap" style="text-align:center"><div class="note n1 pk" style="margin-top:30px"><h1>A Better Workplace</h1><p class="hand" style="font-size:1.7rem;margin:8px 0 0">English Escape Game · 1ère Bac Pro</p></div><div class="row" style="justify-content:center;gap:22px;margin-top:28px"><div class="note n2 bl" style="width:230px"><h3>Espace élèves</h3><p>Rejoignez la mission</p>${btn('Jouer',"go('slg')")}</div><div class="note n1 gr" style="width:230px"><h3>Espace prof</h3><p>Gérer le jeu</p>${btn('Accès prof',"go('tlg')")}</div></div><footer>Créé par C. Iemfre &nbsp;|&nbsp; <a onclick="go('rgpd')">🔒 RGPD</a></footer></div>`;
 if(scr==='slg'||scr==='tlg'){const t=scr==='tlg';return `<div class="wrap"><div class="note n1 ${t?'gr':'bl'}" style="max-width:420px;margin:50px auto"><h2>${t?'Espace professeur':'Espace élèves'}</h2><p>Entrez le code d'accès</p><input id="c" type="password" aria-label="Code d'accès" onkeydown="if(event.key==='Enter')login('${t?'t':'s'}')"><div class="err" id="e"></div><div class="row">${btn('Entrer',`login('${t?'t':'s'}')`)}${btn('← Accueil',"go('home')",'sm')}</div></div></div>`}
 if(scr==='tdb')return `<div class="wrap"><div class="note n2 gr"><h2>Espace professeur</h2><p><b>Code d'accès élèves :</b> WORKPLACE<br><b>Code maître final :</b> THIS IS A BETTER WORKPLACE</p>${btn('← Accueil',"go('home')",'sm')}</div><div class="note n1"><h3>Les 5 niveaux</h3>${MT.map((t,i)=>`<p><b>${MS[i][0]} ${MS[i][1]} :</b> ${t}</p>`).join('')}<p>3 tentatives par exercice, jamais de blocage. Réussite : ≥80 % (+50 pts), ≥70 % en tentative 2 (+30 pts).</p></div></div>`;
 if(scr==='id'){const ids=savedIds();return `<div class="wrap"><div class="note n1 bl" style="max-width:480px;margin:30px auto"><h2>Qui joue ?</h2><p>2 premières lettres du prénom et du nom</p><div class="row"><input aria-label="Prénom (2 lettres)" placeholder="JO" value="${tmp.f}" oninput="setN('f',this)" style="width:90px;text-align:center"><b>-</b><input aria-label="Nom (2 lettres)" placeholder="SM" value="${tmp.l}" oninput="setN('l',this)" style="width:90px;text-align:center"></div><div class="err" id="e">${msg}</div>${btn('Continuer',"goId()")} ${btn('← Retour',"go('home')",'sm')}</div>${ids.length?`<div class="note n2"><h3>Reprendre ma partie</h3>${ids.map(i=>`<div class="row" style="margin:8px 0"><b class="hand" style="font-size:1.5rem">${i}</b>${btn('Reprendre',`resume('${i}')`,'sm')}${btn('🗑',`del('${i}')`,'sm')}</div>`).join('')}<p style="font-size:.85rem">Parties enregistrées sur cet appareil uniquement.</p></div>`:''}</div>`}
 if(scr==='choice'){const s=load(tmp.ex)||{pts:0,rv:[]};return `<div class="wrap"><div class="note n1 or" style="max-width:480px;margin:40px auto"><h2>Bon retour, ${tmp.ex} !</h2><p>Une partie existe déjà : <b>${s.pts} pts</b>, ${s.rv.length}/5 mot(s) secret(s).</p><div class="row">${btn('▶ Reprendre',`resume('${tmp.ex}')`)}${btn('↺ Reprendre à zéro',`restart('${tmp.ex}')`)}</div><p>${btn('← Changer d\'identifiant',"go('id')",'sm')}</p></div></div>`}
 if(scr==='board'){const col=['bl','pk','gr','or','bl'],all=[1,2,3,4,5].every(k=>S.dn[k]);return `<div class="wrap"><h2 style="margin:6px 0">Joueur ${S.id}</h2><div class="ban" style="background:#fffdf0">Réussissez les 5 missions pour trouver les 5 mots secrets, puis recomposez la phrase. Trois tentatives par exercice : aucune mission ne vous bloque.</div><div class="grid">${MS.map((m,i)=>{const k=i+1,dn=S.dn[k],on=!dn&&(k===1||S.dn[k-1]);return `<div class="note ${col[i]} ${on?'':'lock'}" ${on?`onclick="attempt(${k})" tabindex="0" role="button" onkeydown="if(event.key==='Enter')attempt(${k})"`:''}><div style="font-size:2rem">${dn?'✅':on?m[0]:'🔒'}</div><h3>${m[1]}</h3><div>${m[2]}</div><p style="margin:8px 0 0;font-weight:800">${dn?'Terminée':on?'Tentative '+S.att[k]+' / 3':'À débloquer'}</p></div>`}).join('')}</div>${all?`<div class="note n1 or" style="text-align:center"><h3>🔐 Master Code</h3>${btn('Entrer la phrase secrète',"go('fin')")}</div>`:''}<div class="note n2"><h3>🧩 Mots secrets trouvés (${S.rv.length}/5)</h3>${S.rv.length?S.rv.map(w=>`<span class="chip">${w}</span>`).join(''):'<span>Aucun pour l\'instant.</span>'}<p style="font-size:.85rem;margin:8px 0 0">Les mots sont dans le désordre : il faudra recomposer la phrase.</p></div>${btn('← Quitter (progression sauvegardée)',"S=null;go('home')",'sm')}</div>`}
 if(scr==='ex'){const k=E.k;return `<div class="wrap"><div class="note n1 ${['','bl','pk','gr','or','bl'][k]}"><h2>${MS[k-1][0]} ${MS[k-1][1]} — Tentative ${S.att[k]} / 3</h2></div>${E.banner?`<div class="ban">${E.banner}</div>`:''}${[0,vQ,vM,vV,vM,vT][k]()}</div>`}
 if(scr==='reveal')return `<div class="wrap"><div class="note n1 pk" style="text-align:center;margin-top:30px"><p class="hand" style="font-size:1.8rem;margin:0">Mission ${E.k} terminée ! Mot secret :</p><div class="big">${S.words[E.k-1]}</div><p>📝 Notez-le : les 5 mots forment une phrase.</p><div>${S.rv.map(w=>`<span class="chip">${w}</span>`).join('')}</div><p>${btn('Retour au tableau →',"go('board')")}</p></div></div>`;
 if(scr==='fin')return `<div class="wrap"><div class="note n1 or" style="max-width:560px;margin:30px auto;text-align:center"><h2>🔐 Master Code</h2><p>Recomposez la phrase avec vos 5 mots :</p><div>${S.rv.map(w=>`<span class="chip">${w}</span>`).join('')}</div><input id="fc" aria-label="Phrase secrète" style="margin:12px 0;text-align:center" onkeydown="if(event.key==='Enter')chkF()"><div class="err" id="e"></div>${btn('🔓 Ouvrir','chkF()')} ${btn('← Retour',"go('board')",'sm')}</div></div>`;
 if(scr==='vic')return `<div class="wrap"><div class="note n1 pk" style="text-align:center;margin-top:30px"><h1>Bravo ${S.id} !</h1><p class="hand" style="font-size:2rem;margin:8px 0">THIS IS A BETTER WORKPLACE</p><p>Score final : <b>${S.pts} pts</b> · Durée : ${Math.round(((S.t1||Date.now())-S.t0)/60000)} min</p>${btn('📥 Voir mon rapport',"S._b='vic';go('rep')")} ${btn('Accueil',"S=null;go('home')",'sm')}</div></div>`;
 if(scr==='rep'){const f=['','Vocabulaire (QCM)','Matching FR → EN','Vrai / Faux','Mot / définition','Présent simple'];const done=S.res.length;return `<div class="wrap"><div class="row noprint">${btn('← Retour',"go(S._b||'board')",'sm')}${btn('🖨️ PDF (imprimer)','window.print()','sm')}${btn('📄 Word','dl()','sm')}</div><div class="note" id="rp"><h2>A Better Workplace — Rapport de ${S.id}</h2><p>${new Date().toLocaleDateString('fr-FR')} · Score : <b>${S.pts} pts</b></p><table style="width:100%;border-collapse:collapse" border="1" cellpadding="6"><tr><th>Mission</th><th>Tent.</th><th>Score</th><th>Résultat</th><th>Points</th></tr>${S.res.map(r=>`<tr><td>${r.m}. ${f[r.m]}</td><td>${r.a}</td><td>${r.sc}/${r.t}</td><td>${r.ok?'Réussi':'À revoir'}</td><td>${r.d>0?'+':''}${r.d}</td></tr>`).join('')||'<tr><td colspan="5">Aucun exercice terminé pour l\'instant.</td></tr>'}</table><h3 style="margin-top:14px">Erreurs et corrections</h3>${S.wr.length?S.wr.map(w=>`<p><b>M${w.m} · tent. ${w.a} — ${w.q}</b><br>✗ ${w.given} &nbsp; ✓ <b>${w.correct}</b></p>`).join(''):'<p>Aucune erreur enregistrée.</p>'}<h3>Pour progresser</h3><p>Relisez les corrections ci-dessus : recopiez les mots et les formes que vous avez ratés, puis rejouez avec le même identifiant ou en recommençant à zéro. Chaque partie propose un nouveau tirage de mots et de phrases. Visez 80 % dès la première tentative !</p></div></div>`}
 if(scr==='rgpd')return `<div class="wrap"><div class="note n1 gr"><h2>Protection des données personnelles</h2></div><div class="note"><p>Cette application est un outil pédagogique développé pour un usage en classe.</p><ul><li>Aucune donnée n'est transmise à un serveur externe : toutes les informations (identifiant, réponses, score) restent uniquement dans la mémoire de votre navigateur.</li><li>Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.</li><li>Les seules données saisies sont : les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices.</li><li>Ces données sauvegardées en stockage local uniquement (sur la tablette utilisée par l’élève uniquement).</li><li>Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur.</li></ul>${btn('← Retour',"go('home')",'sm')}</div></div>`;
 return '';
}
/* ── Missions 1 à 5 ── */
const F=x=>x[0].includes('(?)')?2:x[0].includes('(–)')?1:0;
function mix(a){let r,ok;do{r=shuf(a);ok=!r.some((x,i)=>i>1&&F(x)===F(r[i-1])&&F(x)===F(r[i-2]))}while(!ok);return r}
function attempt(k,banner){const a=S.att[k]-1;E={k,banner,done:false};
 if(k===1)Object.assign(E,{ans:{},qs:S.sets[1][a].map(i=>{const d=shuf(P.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[1]);const o=shuf([P[i][1],...d]);return{w:P[i][0],o,c:o.indexOf(P[i][1])}})});
 else if(k===2||k===4)Object.assign(E,{ids:S.sets[k][a],mt:{},sel:null,ls:shuf(S.sets[k][a]),rs:shuf(S.sets[k][a])});
 else if(k===3)Object.assign(E,{tx:TX[a],ans:{}});
 else Object.assign(E,{items:mix(SN[a]),typ:{}});
 go('ex')}
const N=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim();
const chk=(it,v)=>it[1].split('/').some(a=>a.split('|').every((p,j)=>N(v[j]||'')===N(p)));
function G(){const k=E.k;let sc=0,wr=[];
 if(k===1){E.qs.forEach((x,i)=>E.ans[i]===x.c?sc++:wr.push({q:'« '+x.w+' »',given:x.o[E.ans[i]]||'—',correct:x.o[x.c]}));return{sc,t:10,wr}}
 if(k===2||k===4){E.ids.forEach(i=>{if(E.mt[i]===i)sc++;else wr.push({q:k===2?P[i][1]:P[i][0],given:E.mt[i]!=null?(k===2?P[E.mt[i]][0]:D[E.mt[i]]):'—',correct:k===2?P[i][0]:D[i]})});return{sc,t:10,wr}}
 if(k===3){E.tx[2].forEach((x,i)=>{const a=!!x[1];E.ans[i]===a?sc++:wr.push({q:x[0],given:E.ans[i]?'VRAI':'FAUX',correct:a?'VRAI':'FAUX'})});return{sc,t:12,wr}}
 E.items.forEach((it,i)=>{if(chk(it,E.typ[i]||[]))sc++;else wr.push({q:it[0].replace(/____/g,'___'),given:(E.typ[i]||[]).join(' ')||'—',correct:it[1].split('/')[0].split('|').join(' ')})});return{sc,t:12,wr}}
function bar(n,t){if(E.done)return `<div class="row" style="justify-content:space-between;margin-top:10px"><b>${G().sc}/${t} bonnes réponses</b>${btn('Continuer →','cont()')}</div>`;return `<div class="row" style="justify-content:space-between;margin-top:10px"><span>${n}/${t} répondues</span>${btn('✅ Valider','val()',n<t?'disabled':'',n<t?'disabled':'')}</div>`}
function val(){if(E.k===5)E.items.forEach((_,i)=>ty(i));E.done=true;render();scrollTo(0,0)}
const key=(f)=>`tabindex="0" role="button" onclick="${f}" onkeydown="if(event.key==='Enter')${f}"`;
function vQ(){const n=Object.keys(E.ans).length;return E.qs.map((x,i)=>`<div class="q"><b>${i+1}. Que signifie « ${x.w} » ?</b>${x.o.map((o,j)=>{let c=E.ans[i]===j?' sel':'';if(E.done)c=j===x.c?' ok':E.ans[i]===j?' ko':'';return `<div class="opt${c}" ${key(`pick(${i},${j})`)}>${o}${E.done&&j===x.c?' ✓':E.done&&E.ans[i]===j?' ✗':''}</div>`}).join('')}</div>`).join('')+bar(n,10)}
function pick(i,j){if(!E.done){E.ans[i]=j;render()}}
function vM(){const k=E.k,n=Object.keys(E.mt).length,u=Object.values(E.mt);
 const L=E.ls.map(i=>{let c=E.sel===i?' sel':E.mt[i]!=null?' used':'';if(E.done)c=E.mt[i]===i?' ok':' ko';return `<div class="opt${c}" ${key(`sl(${i})`)}>${k===2?P[i][1]:P[i][0]}</div>`}).join('');
 const R=E.rs.map(j=>{let c=u.includes(j)?' used':'';if(E.done){const l=Object.keys(E.mt).find(x=>E.mt[x]===j);c=l!=null&&+l===j?' ok':' ko'}return `<div class="opt${c}" ${key(`sr(${j})`)}>${k===2?P[j][0]:D[j]}</div>`}).join('');
 return `<div class="ban">⚠️ Aucun retour en arrière possible : lisez bien avant de valider chaque association.<br>① Cliquez un mot ② cliquez sa correspondance.</div><div class="two"><div>${L}</div><div>${R}</div></div>`+bar(n,10)}
function sl(i){if(!E.done&&E.mt[i]==null){E.sel=i;render()}}
function sr(j){if(!E.done&&E.sel!=null&&!Object.values(E.mt).includes(j)){E.mt[E.sel]=j;E.sel=null;render()}}
function vV(){const t=E.tx,n=Object.keys(E.ans).length;
 const rows=t[2].map((x,i)=>{const a=!!x[1],g=E.ans[i];const c=E.done?(g===a?' ok':' ko'):'';return `<div class="q${c}"><b>${i+1}.</b> ${x[0]}<div class="row" style="margin-top:8px">${btn('VRAI',`ans(${i},true)`,g===true?'on':'')}${btn('FAUX',`ans(${i},false)`,g===false?'on':'')}</div></div>`}).join('');
 return `<div class="vf"><div class="tx" id="tx"><h3>${t[0]}</h3><p>${t[1].replace(/\n/g,'<br><br>')}</p><button class="btn sm fab3" onclick="document.getElementById('tx').classList.remove('open')">Fermer</button></div><div class="qs">${rows}${bar(n,12)}</div></div><button class="btn fab" onclick="document.getElementById('tx').classList.add('open')">📄 Texte</button>`}
function ans(i,v){if(!E.done){E.ans[i]=v;render()}}
function vT(){const rows=E.items.map((it,i)=>{const p=it[0].split('____');let h=p[0];for(let j=1;j<p.length;j++)h+=`<input class="ti" id="i${i}_${j-1}" autocomplete="off" autocapitalize="off" aria-label="Réponse ${i+1}" value="${((E.typ[i]||[])[j-1]||'').replace(/"/g,'')}" ${E.done?'disabled':''} oninput="ty(${i})">`+p[j];
  const ok=E.done&&chk(it,E.typ[i]||[]);return `<div class="q${E.done?(ok?' ok':' ko'):''}"><b>${i+1}.</b> ${h}${E.done&&!ok?`<div>✓ <b>${it[1].split('/')[0].split('|').join(' ')}</b></div>`:''}</div>`}).join('');
 return `<details open class="ban"><summary><b>Rappel</b></summary>Affirmatif : he / she / it + verbe + <b>s</b> (finishes, goes, tries, has).<br>Négatif : <b>don't</b> (I, you, we, they) ou <b>doesn't</b> (he, she, it) + verbe de base.<br>Interrogatif : <b>Do</b> / <b>Does</b> + sujet + verbe de base ?<br>Négatif (–) : tapez la forme complète. Interrogatif (?) : 1ʳᵉ case = Do/Does, 2ᵉ case = verbe.</details>${rows}`+bar(12,12)}
function ty(i){E.typ[i]=[...document.querySelectorAll('[id^="i'+i+'_"]')].map(x=>x.value)}
function cont(){const k=E.k,a=S.att[k],g=G(),t=g.t;let ok,d;
 if(a===1){ok=g.sc>=Math.ceil(t*.8);d=ok?50:-10}else if(a===2){ok=g.sc>=Math.ceil(t*.7);d=ok?30:-15}else{ok=g.sc>=Math.ceil(t*.5);d=Math.round(g.sc/t*20)}
 S.pts+=d;S.res.push({m:k,a,sc:g.sc,t,ok,d});g.wr.forEach(w=>S.wr.push({m:k,a,...w}));
 if(ok||a===3){S.dn[k]=1;if(!S.rv.includes(S.words[k-1]))S.rv.push(S.words[k-1]);save();go('reveal')}
 else{S.att[k]++;save();attempt(k,`💪 Tentative ${a} : ${g.sc}/${t} — ${d} pts. Nouvelle tentative avec un contenu différent !`)}}
function chkF(){const v=(document.getElementById('fc').value||'').trim().toUpperCase().replace(/\s+/g,' ');if(v==='THIS IS A BETTER WORKPLACE'){S.t1=Date.now();save();go('vic')}else document.getElementById('e').textContent='❌ Code incorrect. Réarrangez vos 5 mots !'}
function dl(){const b=new Blob(['<html><meta charset="utf-8"><body>'+document.getElementById('rp').innerHTML+'</body></html>'],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='rapport-'+S.id+'.doc';a.click()}
render();
</script>
</body>
